# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Tom's Garden"
  pageTitleSuffix: " | Tom Plant"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: cabin
  locale: en-GB
  baseUrl: tplant.com.au
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: true
    # the two faces above the fold on every page: body text and headings
    preload:
      - static/fonts/geist-v5.3.0-latin-normal.woff2
      - static/fonts/newsreader-v5.3.0-opsz40-latin-normal.woff2
    typography:
      header: Newsreader
      body: Geist
      code: Geist Mono
    # Warm paper and ink in light mode, a green-tinted near-black in dark mode.
    # gray is the lightest colour used for text (dates, metadata) and keeps a
    # 4.5:1 contrast on light; secondary is the link and accent green, tertiary
    # the terracotta used for hover. quartz/styles/custom.scss adds --surface.
    colors:
      lightMode:
        light: "#FAF8F2"
        lightgray: "#E9E5D9"
        gray: "#6E6A5E"
        darkgray: "#3A382F"
        dark: "#16150F"
        secondary: "#1F6B43"
        tertiary: "#B4491F"
        highlight: "rgba(31, 107, 67, 0.1)"
        textHighlight: "rgba(250, 204, 21, 0.4)"
      darkMode:
        light: "#101412"
        lightgray: "#252C28"
        gray: "#8D9891"
        darkgray: "#C5CEC8"
        dark: "#F0F4F1"
        secondary: "#7DD694"
        tertiary: "#F0A070"
        highlight: "rgba(125, 214, 148, 0.12)"
        textHighlight: "rgba(250, 204, 21, 0.3)"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: true
      enableCheckbox: false
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 10
      display: desktop-only
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
      disableBrokenWikilinks: true
      externalLinkIcon: false
      # native lazy loading for embedded images/iframes below the fold
      lazyLoad: true
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  # disabled: no notes use maths, and it rendered dollar amounts in tables
  # ("$35.67 + $23.81") as LaTeX while loading KaTeX CSS/JS from jsDelivr on
  # every page
  - source: github:quartz-community/latex
    enabled: false
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    options:
      header: Newsreader
      body: Geist
      code: Geist Mono
      # faces are self-hosted from quartz/static/fonts via quartz/styles/fonts.scss
      fontOrigin: local
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: ./plugins/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
    options:
      colorScheme: darkMode
      # avoid "Tom Plant | Tom Plant"
      excludeRoot: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  # The file tree is replaced by the top bar links (./plugins/nav) and the
  # per-folder note index (./plugins/folder-tree).
  - source: github:quartz-community/explorer
    enabled: false
    layout:
      position: left
      priority: 50
      display: all
  # vendored from quartz-community/graph@46f0ba1: d3/PixiJS load lazily (see
  # plugins/graph/src/components/scripts/graph.inline.ts)
  - source: ./plugins/graph
    enabled: true
    layout:
      position: right
      priority: 30
      condition: not-index
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 20
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: ./plugins/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  # The garden frame (quartz/components/frames/GardenFrame.tsx) renders the
  # left slot as the site header: site title, nav links, then the toolbar group
  # pushed to the right.
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: ./plugins/nav
    enabled: true
    options:
      links:
        Posts: posts/
        Notes: notes/
        Ideas: ideas
        Now: now
        About: whoami
    layout:
      position: left
      priority: 20
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  # disabled: it only hides the sidebars, and the reading column no longer has any
  - source: github:quartz-community/reader-mode
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    options:
      spacerSymbol: /
      showCurrentPage: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: true
    options:
      provider: giscus
      options:
        repo: pl4nty/garden
        repoId: R_kgDOLr2SEQ
        category: Announcements
        categoryId: DIC_kwDOLr2SEc4Cftp8
        reactionsEnabled: false
    layout:
      position: afterBody
      priority: 10
      condition: not-index
  - source: ./plugins/footer
    enabled: true
    options:
      links:
        License: /license
        RSS: /index.xml
        GitHub: https://github.com/pl4nty
        LinkedIn: https://linkedin.com/in/tomplant
        Homelab: https://lab.tplant.com.au/
  # Homepage: the heading block goes above the page content and the curated
  # lists below it. Both render on the index page only.
  - source: ./plugins/home
    enabled: true
    options:
      section: hero
      eyebrow: Tom Plant · Melbourne, Australia
      heading: Exploring, experimenting, and *(sometimes)* writing.
    layout:
      position: beforeBody
      priority: 1
  - source: ./plugins/home
    enabled: true
    options:
      section: sections
      links:
        GitHub: https://github.com/pl4nty
        LinkedIn: https://linkedin.com/in/tomplant
        Homelab: https://lab.tplant.com.au/
        RSS: /index.xml
      featured:
        - "posts/building-australia's-largest-highschool-ctf"
        - "posts/finding-an-unreleased-windows-feature"
        - "posts/use-a-custom-outlook.com-email-without-godaddy"
      postsFolder: posts
      notesFolder: notes
      recentCount: 6
    layout:
      position: afterBody
      priority: 5
  # Every note below a folder, grouped by subfolder, on the folder's own page.
  - source: ./plugins/folder-tree
    enabled: true
    options:
      roots:
        - notes
    layout:
      position: afterBody
      priority: 1
  - source: ./plugins/explorer-tweaks
    enabled: false
    layout:
      position: body
      priority: 110
      display: all
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: false
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      template: garden
    folder:
      template: garden
      exclude:
        - reader-mode
        - tag-list
        - comments
      positions:
        right: []
    tag:
      template: garden
      exclude:
        - reader-mode
        - tag-list
        - comments
      positions:
        right: []
    canvas: {}
    bases:
      template: garden
