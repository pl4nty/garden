# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Tom’s Garden"
  pageTitleSuffix: " | Tom Plant"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: cabin
  locale: en-GB
  baseUrl: tplant.com.au
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: true
    typography:
      header: Atkinson Hyperlegible Mono
      body: Atkinson Hyperlegible Mono
      code: Atkinson Hyperlegible Mono
    # The page takes its colours from the garden scene on the homepage: light
    # mode from the scene at midday, dark mode from the scene at night (the
    # scene's own palettes are in plugins/light/src/palettes.ts, and `light`
    # here must match PAGE there). Green is for links and plants only.
    #   light      the page: the scene's haze by day, its sky by night
    #   lightgray  rules and borders
    #   gray       the quiet text: dates, captions, the way back
    #   darkgray   body text
    #   dark       headings and titles
    #   secondary  links: the green this site has always used
    #   tertiary   links under the pointer
    #   highlight  the wash behind code
    colors:
      lightMode:
        light: "#F2F3EA"
        lightgray: "#D5D9C9"
        gray: "#566158"
        darkgray: "#27332B"
        dark: "#17211A"
        secondary: "#2E7D32"
        tertiary: "#1B5E20"
        highlight: "rgba(86, 110, 80, 0.08)"
        textHighlight: "rgba(223, 174, 54, 0.35)"
      darkMode:
        light: "#0C1219"
        lightgray: "#26303B"
        gray: "#8997A1"
        darkgray: "#C7D0D1"
        dark: "#E9EEEA"
        secondary: "#81C784"
        tertiary: "#A5D6A7"
        highlight: "rgba(140, 170, 190, 0.1)"
        textHighlight: "rgba(220, 205, 140, 0.28)"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: true
      enableCheckbox: false
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  # The table of contents is one line under the title, closed until asked for.
  - source: github:quartz-community/table-of-contents
    enabled: true
    options:
      collapseByDefault: true
    order: 50
    layout:
      position: beforeBody
      priority: 40
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
      disableBrokenWikilinks: true
      externalLinkIcon: false
      # native lazy loading for embedded images/iframes below the fold
      lazyLoad: true
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  # disabled: no notes use maths, and it rendered dollar amounts in tables
  # ("$35.67 + $23.81") as LaTeX while loading KaTeX CSS/JS from jsDelivr on
  # every page
  - source: github:quartz-community/latex
    enabled: false
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    options:
      header: Atkinson Hyperlegible Mono
      body: Atkinson Hyperlegible Mono
      code: Atkinson Hyperlegible Mono
      # faces are self-hosted from quartz/static/fonts via quartz/styles/fonts.scss
      fontOrigin: local
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: ./plugins/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
    options:
      colorScheme: darkMode
      # avoid "Tom Plant | Tom Plant"
      excludeRoot: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  # No file tree: the homepage and ./plugins/folder-tree on /notes/ list
  # every note.
  - source: github:quartz-community/explorer
    enabled: false
    layout:
      position: left
      priority: 50
      display: all
  # vendored from quartz-community/graph@46f0ba1: d3/PixiJS load lazily (see
  # plugins/graph/src/components/scripts/graph.inline.ts). Backlinks and the
  # graph share one quiet row after the note's plant.
  - source: ./plugins/graph
    enabled: true
    layout:
      position: afterBody
      priority: 7
      group: links
      condition: not-index
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: afterBody
      priority: 6
      group: links
      condition: not-index
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: ./plugins/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  # The head of every page is one line (the left slot, laid out as a bar by
  # quartz/styles/custom.scss): the way back on the left, or on the homepage
  # the site's name; search and the light switch on the right.
  - source: github:quartz-community/page-title
    enabled: false
    layout:
      position: left
      priority: 10
  - source: ./plugins/nav
    enabled: true
    options:
      descriptor: notes and posts by Tom Plant, hacker and maker in Melbourne
    layout:
      position: left
      priority: 10
  # ./plugins/light replaces the two-state theme toggle: it follows the
  # visitor's clock unless they choose day or night.
  - source: github:quartz-community/darkmode
    enabled: false
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: ./plugins/light
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  # every page is already the reading view
  - source: github:quartz-community/reader-mode
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  # the way back (./plugins/nav) stands in for breadcrumbs
  - source: github:quartz-community/breadcrumbs
    enabled: false
    options:
      spacerSymbol: /
      showCurrentPage: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: true
    options:
      provider: giscus
      options:
        repo: pl4nty/garden
        repoId: R_kgDOLr2SEQ
        category: Announcements
        categoryId: DIC_kwDOLr2SEc4Cftp8
        reactionsEnabled: false
    layout:
      position: afterBody
      priority: 10
      condition: not-index
  - source: ./plugins/footer
    enabled: true
    options:
      pages:
        home: ""
        posts: posts/
        notes: notes/
        ideas: ideas
        now: now
        whoami: whoami
      links:
        GitHub: https://github.com/pl4nty
        LinkedIn: https://linkedin.com/in/tomplant
        Homelab: https://lab.tplant.com.au/
        License: /License
  # the links out are in the footer
  - source: ./plugins/socials
    enabled: false
    options:
      links:
        GitHub: https://github.com/pl4nty
        LinkedIn: https://linkedin.com/in/tomplant
        Homelab: https://lab.tplant.com.au/
    layout:
      position: left
      priority: 15
      group: toolbar
  # Homepage: the garden scene fills the first screen, with a plant for every
  # note and post; the note's own text follows, then the lists of posts by
  # year and notes by folder. Index page only.
  - source: ./plugins/home
    enabled: true
    options:
      section: scene
    layout:
      position: beforeBody
      priority: 1
  - source: ./plugins/home
    enabled: true
    options:
      section: index
      postsFolder: posts
      notesFolder: notes
    layout:
      position: afterBody
      priority: 5
  # Every note below a folder, grouped by subfolder, on the folder's own page.
  - source: ./plugins/folder-tree
    enabled: true
    options:
      roots:
        - notes
    layout:
      position: afterBody
      priority: 1
  # At the foot of each note: its plant, the same drawing that stands in the
  # garden, with the dates it was planted and tended.
  - source: ./plugins/note-plant
    enabled: true
    layout:
      position: afterBody
      priority: 3
  - source: ./plugins/explorer-tweaks
    enabled: false
    layout:
      position: body
      priority: 110
      display: all
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: false
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 1.5rem
    links:
      priority: 6
      direction: row
      gap: 3rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - tag-list
        - comments
        - table-of-contents
        - backlinks
        - graph
    tag:
      exclude:
        - tag-list
        - comments
        - table-of-contents
        - backlinks
        - graph
    canvas: {}
    bases: {}
