# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Tom’s Garden"
  pageTitleSuffix: " | Tom Plant"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: cabin
  locale: en-GB
  baseUrl: tplant.com.au
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: true
    typography:
      header: Rubik
      body: Atkinson Hyperlegible Next
      code: Fira Code
    # A two-ink risograph print. Every colour on the site is the paper, one of
    # two inks, the two printed on top of each other, or a tint or shade of
    # those. Ink 1 is the green this site has always used, a step brighter;
    # ink 2 is fluorescent pink. In dark mode the stock is black and the inks
    # are their luminous versions.
    #   light      the paper
    #   lightgray  rules and borders
    #   gray       the faintest text: dates and captions
    #   darkgray   body text: the overprint of both inks
    #   dark       headings
    #   secondary  ink 1 (green)
    #   tertiary   ink 2 (pink)
    # quartz/styles/custom.scss names these --paper, --ink1, --ink2 and --over,
    # and adds the shades of each ink that are dark enough for small text.
    colors:
      lightMode:
        light: "#F0F1ED"
        lightgray: "#C8CEC6"
        gray: "#56635A"
        darkgray: "#1B2B22"
        dark: "#1B2B22"
        secondary: "#1F9140"
        tertiary: "#FF48B0"
        highlight: "rgba(31, 145, 64, 0.12)"
        textHighlight: "rgba(255, 72, 176, 0.4)"
      darkMode:
        light: "#151515"
        lightgray: "#343834"
        gray: "#9BA19B"
        darkgray: "#E6E7E1"
        dark: "#F2F2EC"
        secondary: "#4CCB7A"
        tertiary: "#FF6EC4"
        highlight: "rgba(76, 203, 122, 0.14)"
        textHighlight: "rgba(255, 110, 196, 0.4)"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: true
      enableCheckbox: false
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 10
      display: desktop-only
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
      disableBrokenWikilinks: true
      externalLinkIcon: false
      # native lazy loading for embedded images/iframes below the fold
      lazyLoad: true
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  # disabled: no notes use maths, and it rendered dollar amounts in tables
  # ("$35.67 + $23.81") as LaTeX while loading KaTeX CSS/JS from jsDelivr on
  # every page
  - source: github:quartz-community/latex
    enabled: false
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    options:
      header: Rubik
      body: Atkinson Hyperlegible Next
      code: Fira Code
      # faces are self-hosted from quartz/static/fonts via quartz/styles/fonts.scss
      fontOrigin: local
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: ./plugins/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
    options:
      colorScheme: darkMode
      # avoid "Tom Plant | Tom Plant"
      excludeRoot: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  # The file tree is replaced by the sidebar links (./plugins/nav) and the
  # index of notes on each folder page (./plugins/folder-tree).
  - source: github:quartz-community/explorer
    enabled: false
    layout:
      position: left
      priority: 50
      display: all
  # vendored from quartz-community/graph@46f0ba1: d3/PixiJS load lazily (see
  # plugins/graph/src/components/scripts/graph.inline.ts)
  - source: ./plugins/graph
    enabled: true
    layout:
      position: right
      priority: 30
      condition: not-index
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 20
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: ./plugins/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  # Left sidebar, top to bottom: the site title with the toolbar group
  # (search, theme, reader mode) beside it, the index of the site, and the
  # links out at the foot.
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: ./plugins/nav
    enabled: true
    options:
      part: sidebar
      featured:
        - posts/building-australia's-largest-highschool-ctf
        - posts/finding-an-unreleased-windows-feature
        - posts/use-a-custom-outlook.com-email-without-godaddy
      recentCount: 4
      links:
        Posts: posts/
        Notes: notes/
        Ideas: ideas
        Now: now
        Whoami: whoami
    layout:
      position: left
      priority: 40
  # The same two lists at the foot of the homepage, for a phone, where the
  # sidebar is a header with no room for them.
  - source: ./plugins/nav
    enabled: true
    options:
      part: home
      featured:
        - posts/building-australia's-largest-highschool-ctf
        - posts/finding-an-unreleased-windows-feature
        - posts/use-a-custom-outlook.com-email-without-godaddy
      recentCount: 4
    layout:
      position: afterBody
      priority: 5
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    options:
      spacerSymbol: /
      showCurrentPage: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: true
    options:
      provider: giscus
      options:
        repo: pl4nty/garden
        repoId: R_kgDOLr2SEQ
        category: Announcements
        categoryId: DIC_kwDOLr2SEc4Cftp8
        reactionsEnabled: false
    layout:
      position: afterBody
      priority: 10
      condition: not-index
  - source: ./plugins/footer
    enabled: true
    options:
      links:
        License: /License
  - source: ./plugins/socials
    enabled: true
    options:
      links:
        GitHub: https://github.com/pl4nty
        LinkedIn: https://linkedin.com/in/tomplant
        Homelab: https://lab.tplant.com.au/
    layout:
      position: left
      priority: 50
  # Homepage banner: a dithered garden bed, drawn in the browser, with a
  # plant for each of the most recently tended notes and a daisy for each post.
  - source: ./plugins/home
    enabled: true
    options:
      notesFolder: notes
      postsFolder: posts
      plants: 36
      height: 64
    layout:
      position: beforeBody
      priority: 1
  # Every note below a folder, grouped by subfolder, on the folder's own page.
  - source: ./plugins/folder-tree
    enabled: true
    options:
      roots:
        - notes
    layout:
      position: afterBody
      priority: 1
  # The colophon: the note's own plant as a two-ink stamp at the end of each
  # note, grown from its length and its links, with the date it was last tended.
  - source: ./plugins/note-plant
    enabled: true
    layout:
      position: afterBody
      priority: 3
  - source: ./plugins/explorer-tweaks
    enabled: false
    layout:
      position: body
      priority: 110
      display: all
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: false
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 20
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
        - tag-list
        - comments
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
        - tag-list
        - comments
      positions:
        right: []
    canvas: {}
    bases: {}
