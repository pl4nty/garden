# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Tom’s Garden"
  pageTitleSuffix: " | Tom Plant"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: cabin
  locale: en-GB
  baseUrl: tplant.com.au
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: true
    typography:
      header: Vollkorn
      body: Vollkorn
      code: Fira Code
    # Green ink on greenbar paper: the green this site has always used, as the
    # colour of the text itself and not as an accent on grey. There is no second
    # hue. Dark mode is a near-black page with pale ink; green stays in the site
    # title, the rules under links and the stripes.
    #   light      the paper
    #   lightgray  rules and borders
    #   gray       the lightest text: dates and captions (5.4:1 on light)
    #   darkgray   body text
    #   dark       headings, links, and the plants
    #   secondary  the brand green: the site title and hover
    # quartz/styles/custom.scss adds --bar (the greenbar stripe) and --underline.
    colors:
      lightMode:
        light: "#F5F9F3"
        lightgray: "#CFE0CC"
        gray: "#566A5D"
        darkgray: "#2B4233"
        dark: "#12351F"
        secondary: "#2E7D32"
        tertiary: "#1B5E20"
        highlight: "rgba(46, 125, 50, 0.12)"
        textHighlight: "rgba(46, 125, 50, 0.22)"
      darkMode:
        light: "#131413"
        lightgray: "#2F342F"
        gray: "#8C968D"
        darkgray: "#CDD5CE"
        dark: "#EEF2EE"
        secondary: "#81C784"
        tertiary: "#A5D6A7"
        highlight: "rgba(129, 199, 132, 0.12)"
        textHighlight: "rgba(129, 199, 132, 0.25)"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: true
      enableCheckbox: false
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 10
      display: desktop-only
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
      disableBrokenWikilinks: true
      externalLinkIcon: false
      # native lazy loading for embedded images/iframes below the fold
      lazyLoad: true
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  # disabled: no notes use maths, and it rendered dollar amounts in tables
  # ("$35.67 + $23.81") as LaTeX while loading KaTeX CSS/JS from jsDelivr on
  # every page
  - source: github:quartz-community/latex
    enabled: false
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  # acronyms in note bodies are set in small caps
  - source: ./plugins/small-caps
    enabled: true
    order: 95
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    options:
      header: Vollkorn
      body: Vollkorn
      code: Fira Code
      # faces are self-hosted from quartz/static/fonts via quartz/styles/fonts.scss
      fontOrigin: local
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: ./plugins/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
    options:
      colorScheme: darkMode
      # avoid "Tom Plant | Tom Plant"
      excludeRoot: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  # The file tree is replaced by the sidebar links (./plugins/nav) and the
  # index of notes on each folder page (./plugins/folder-tree).
  - source: github:quartz-community/explorer
    enabled: false
    layout:
      position: left
      priority: 50
      display: all
  # vendored from quartz-community/graph@46f0ba1: d3/PixiJS load lazily (see
  # plugins/graph/src/components/scripts/graph.inline.ts)
  - source: ./plugins/graph
    enabled: true
    layout:
      position: right
      priority: 30
      condition: not-index
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 20
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: ./plugins/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  # Left sidebar, top to bottom: the site title, the nav, then the toolbar
  # group (socials, search, theme, reader mode) at the foot.
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: ./plugins/nav
    enabled: true
    options:
      links:
        Posts: posts/
        Notes: notes/
        Ideas: ideas
        Now: now
        Whoami: whoami
    layout:
      position: left
      priority: 12
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    options:
      spacerSymbol: /
      showCurrentPage: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: true
    options:
      provider: giscus
      options:
        repo: pl4nty/garden
        repoId: R_kgDOLr2SEQ
        category: Announcements
        categoryId: DIC_kwDOLr2SEc4Cftp8
        reactionsEnabled: false
    layout:
      position: afterBody
      priority: 10
      condition: not-index
  - source: ./plugins/footer
    enabled: true
    options:
      links:
        License: /License
  - source: ./plugins/socials
    enabled: true
    options:
      links:
        GitHub: https://github.com/pl4nty
        LinkedIn: https://linkedin.com/in/tomplant
        Homelab: https://lab.tplant.com.au/
    layout:
      position: left
      priority: 15
      group: toolbar
  # Homepage: a row of plants above the note, one for each of the most
  # recently tended notes, and contents lists below it. Index page only.
  - source: ./plugins/home
    enabled: true
    options:
      section: bed
      plants: 22
    layout:
      position: beforeBody
      priority: 1
  - source: ./plugins/home
    enabled: true
    options:
      section: contents
      postsFolder: posts
      notesFolder: notes
      recentCount: 6
    layout:
      position: afterBody
      priority: 5
  # Every note below a folder, grouped by subfolder, on the folder's own page.
  - source: ./plugins/folder-tree
    enabled: true
    options:
      roots:
        - notes
    layout:
      position: afterBody
      priority: 1
  # The colophon: a plant at the end of each note, drawn from its length and
  # its links, with the date it was last tended.
  - source: ./plugins/note-plant
    enabled: true
    layout:
      position: afterBody
      priority: 3
  # PREVIEW ONLY: a panel that switches between design variants. See
  # quartz/styles/lab.scss. Remove it when the design is settled.
  - source: ./plugins/design-lab
    enabled: true
    layout:
      position: left
      priority: 99
  - source: ./plugins/explorer-tweaks
    enabled: false
    layout:
      position: body
      priority: 110
      display: all
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: false
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
        - tag-list
        - comments
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
        - tag-list
        - comments
      positions:
        right: []
    canvas: {}
    bases: {}
