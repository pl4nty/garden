# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Tom’s Garden"
  pageTitleSuffix: " | Tom Plant"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: cabin
  locale: en-GB
  baseUrl: tplant.com.au
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: true
    typography:
      header: IBM Plex Sans Condensed
      body: IBM Plex Sans
      code: IBM Plex Mono
    # KiCad's default schematic theme, which anyone who has opened Eeschema
    # knows: cream paper, a dark red sheet frame and component outlines, green
    # wires, teal reference text. Body text is near-black, as KiCad sets local
    # labels. Dark mode is the PCB editor: a near-black board, copper red,
    # a muted green layer and silkscreen off-white.
    #   light      the paper (the board)
    #   lightgray  the lightest rules: between table rows, inside boxes
    #   gray       the lightest text: captions, counts (5.5:1 on light, 6.2:1 dark)
    #   darkgray   body text (15.3:1 on light, 13:1 dark)
    #   dark       headings
    #   secondary  the wire green, darkened until it can also set text
    #   tertiary   the frame red, for hover in community components
    # quartz/styles/custom.scss adds --rule (the frame), --wire (links),
    # --label (teal) and --fill (the body of a component).
    colors:
      lightMode:
        light: "#F5F4EF"
        lightgray: "#D8D4C8"
        gray: "#66635B"
        darkgray: "#1E1D1A"
        dark: "#12110F"
        secondary: "#006A00"
        tertiary: "#840000"
        highlight: "rgba(0, 132, 0, 0.1)"
        textHighlight: "rgba(255, 233, 80, 0.55)"
      darkMode:
        light: "#181B20"
        lightgray: "#353A43"
        gray: "#9D9B8F"
        darkgray: "#E2E0D4"
        dark: "#F1EFE3"
        secondary: "#7CC987"
        tertiary: "#E0685F"
        highlight: "rgba(88, 174, 101, 0.14)"
        textHighlight: "rgba(217, 180, 74, 0.35)"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: true
      enableCheckbox: false
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 10
      display: desktop-only
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
      disableBrokenWikilinks: true
      externalLinkIcon: false
      # native lazy loading for embedded images/iframes below the fold
      lazyLoad: true
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  # disabled: no notes use maths, and it rendered dollar amounts in tables
  # ("$35.67 + $23.81") as LaTeX while loading KaTeX CSS/JS from jsDelivr on
  # every page
  - source: github:quartz-community/latex
    enabled: false
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    options:
      header: IBM Plex Sans Condensed
      body: IBM Plex Sans
      code: IBM Plex Mono
      # faces are self-hosted from quartz/static/fonts via quartz/styles/fonts.scss
      fontOrigin: local
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: ./plugins/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
    options:
      colorScheme: darkMode
      # avoid "Tom Plant | Tom Plant"
      excludeRoot: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  # The file tree is replaced by the sidebar links (./plugins/nav) and the
  # index of notes on each folder page (./plugins/folder-tree).
  - source: github:quartz-community/explorer
    enabled: false
    layout:
      position: left
      priority: 50
      display: all
  # vendored from quartz-community/graph@46f0ba1: d3/PixiJS load lazily (see
  # plugins/graph/src/components/scripts/graph.inline.ts)
  - source: ./plugins/graph
    enabled: true
    layout:
      position: right
      priority: 30
      condition: not-index
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 14
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 20
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  # disabled: the date, the word count and the link to the page's history are
  # fields of the title block (./plugins/footer), so the page header is only
  # the path and the title
  - source: ./plugins/content-meta
    enabled: false
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  # Left column, top to bottom: the site title, the sheet index (nav), search,
  # then at the foot the links out and the toolbar group (theme, reader mode).
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: ./plugins/nav
    enabled: true
    options:
      links:
        Posts: posts/
        Notes: notes/
        Ideas: ideas
        Now: now
        Whoami: whoami
    layout:
      position: left
      priority: 12
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    options:
      spacerSymbol: /
      showCurrentPage: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: true
    options:
      provider: giscus
      options:
        repo: pl4nty/garden
        repoId: R_kgDOLr2SEQ
        category: Announcements
        categoryId: DIC_kwDOLr2SEc4Cftp8
        reactionsEnabled: false
    layout:
      position: afterBody
      priority: 10
      condition: not-index
  # The sheet: the drawing frame with its zone markers, and the title block
  # filled in from the page (title, date, revision, sheet path, size). It
  # takes the footer slot, so it is on every page.
  - source: ./plugins/footer
    enabled: true
    options:
      site: Tom’s Garden
      drawnBy: Tom Plant
      repository: https://github.com/pl4nty/garden
      branch: main
      licence:
        label: CC BY-SA 4.0
        href: /License
  - source: ./plugins/socials
    enabled: true
    options:
      links:
        GitHub: https://github.com/pl4nty
        LinkedIn: https://linkedin.com/in/tomplant
        Homelab: https://lab.tplant.com.au/
    layout:
      position: left
      priority: 32
  # Homepage: a row of plants above the note, one for each of the most
  # recently tended notes; below the note, the posts as a parts list; and in
  # the right-hand column the latest changes to notes, as a drawing keeps its
  # revision history. Index page only.
  - source: ./plugins/home
    enabled: true
    options:
      section: bed
      plants: 22
    layout:
      position: beforeBody
      priority: 1
  - source: ./plugins/home
    enabled: true
    options:
      section: contents
      postsFolder: posts
    layout:
      position: afterBody
      priority: 5
  - source: ./plugins/home
    enabled: true
    options:
      section: revisions
      notesFolder: notes
      recentCount: 8
    layout:
      position: right
      priority: 5
  # Every page below a folder as one parts list, grouped by subfolder, on the
  # folder's own page. Posts are listed newest first, notes by title.
  - source: ./plugins/folder-tree
    enabled: true
    options:
      roots:
        - notes
        - posts
      newestFirst:
        - posts
    layout:
      position: afterBody
      priority: 1
  # A plant at the end of each note, drawn as traces and pads from its length
  # and its links.
  - source: ./plugins/note-plant
    enabled: true
    layout:
      position: afterBody
      priority: 3
  - source: ./plugins/explorer-tweaks
    enabled: false
    layout:
      position: body
      priority: 110
      display: all
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: false
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
        - tag-list
        - comments
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
        - tag-list
        - comments
      positions:
        right: []
    canvas: {}
    bases: {}
