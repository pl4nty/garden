# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Tom’s Garden"
  pageTitleSuffix: " | Tom Plant"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: cabin
  locale: en-GB
  baseUrl: tplant.com.au
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: true
    typography:
      header: Fira Code
      body: Fira Code
      code: Fira Code
    # Plain text on a plain page: two greys per mode, and the green this site
    # has always used as the only accent (links, prompts, markers).
    #   light      the page
    #   lightgray  rules and borders
    #   gray       quiet text: dates, sizes, captions, markers (5.5:1 on light)
    #   darkgray   body text
    #   dark       headings and bold
    #   secondary  the brand green: links, the "$" of a prompt
    #   tertiary   a link under the pointer
    # quartz/styles/custom.scss adds --tint (inline code, the selected row).
    colors:
      lightMode:
        light: "#FAFAF8"
        lightgray: "#D3D6D0"
        gray: "#646A64"
        darkgray: "#1E211E"
        dark: "#0B0D0B"
        secondary: "#2E7D32"
        tertiary: "#1B5E20"
        highlight: "rgba(30, 33, 30, 0.07)"
        textHighlight: "rgba(46, 125, 50, 0.25)"
      darkMode:
        light: "#141514"
        lightgray: "#343734"
        gray: "#8E948E"
        darkgray: "#C8CCC8"
        dark: "#F0F2EF"
        secondary: "#81C784"
        tertiary: "#A5D6A7"
        highlight: "rgba(200, 204, 200, 0.09)"
        textHighlight: "rgba(129, 199, 132, 0.28)"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: true
      enableCheckbox: false
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  # The table of contents is a folded block under the page header: there are
  # no side rails in an 80-column page.
  - source: github:quartz-community/table-of-contents
    enabled: true
    options:
      collapseByDefault: true
      minEntries: 3
    order: 50
    layout:
      position: beforeBody
      priority: 40
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
      disableBrokenWikilinks: true
      externalLinkIcon: false
      # native lazy loading for embedded images/iframes below the fold
      lazyLoad: true
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  # disabled: no notes use maths, and it rendered dollar amounts in tables
  # ("$35.67 + $23.81") as LaTeX while loading KaTeX CSS/JS from jsDelivr on
  # every page
  - source: github:quartz-community/latex
    enabled: false
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    options:
      header: Fira Code
      body: Fira Code
      code: Fira Code
      # faces are self-hosted from quartz/static/fonts via quartz/styles/fonts.scss
      fontOrigin: local
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: ./plugins/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
    options:
      colorScheme: darkMode
      # avoid "Tom Plant | Tom Plant"
      excludeRoot: true
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  # The file tree is replaced by the nav paths (./plugins/nav) and the `tree`
  # of notes on each folder page (./plugins/folder-tree).
  - source: github:quartz-community/explorer
    enabled: false
    layout:
      position: left
      priority: 50
      display: all
  # vendored from quartz-community/graph@46f0ba1: d3/PixiJS load lazily (see
  # plugins/graph/src/components/scripts/graph.inline.ts)
  - source: ./plugins/graph
    enabled: true
    layout:
      position: afterBody
      priority: 8
      condition: not-index
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: afterBody
      priority: 7
      condition: not-index
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: ./plugins/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  # The `left` slot is the head of the page, not a sidebar: the header line of
  # a manual page and the nav paths (./plugins/nav), then the toolbar group
  # (search, theme).
  - source: github:quartz-community/page-title
    enabled: false
  - source: ./plugins/nav
    enabled: true
    options:
      name: TPLANT
      section: 7
      links:
        ~/posts: posts/
        ~/notes: notes/
        ~/ideas: ideas
        ~/now: now
        ~/whoami: whoami
    layout:
      position: left
      priority: 12
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  # disabled: the page is one column of text already
  - source: github:quartz-community/reader-mode
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    options:
      # the folders above a page read as a path: ~/notes/microsoft/intune
      rootName: "~"
      spacerSymbol: /
      showCurrentPage: false
      resolveFrontmatterTitle: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: true
    options:
      provider: giscus
      options:
        repo: pl4nty/garden
        repoId: R_kgDOLr2SEQ
        category: Announcements
        categoryId: DIC_kwDOLr2SEc4Cftp8
        reactionsEnabled: false
    layout:
      position: afterBody
      priority: 10
      condition: not-index
  # The footer line of a manual page: site, the date the page was last
  # modified, and its slug with a manual section, e.g. whoami(1). `sections`
  # maps a slug prefix to a section number; the longest prefix wins.
  - source: ./plugins/footer
    enabled: true
    options:
      site: tplant.com.au
      defaultSection: 7
      sections:
        whoami: 1
        notes: 5
        notes/hardware: 4
        notes/cloud: 8
        notes/microsoft: 8
        ideas: 6
      links:
        github: https://github.com/pl4nty
        linkedin: https://linkedin.com/in/tomplant
        homelab: https://lab.tplant.com.au/
        rss: /index.xml
        license: /License
  # Homepage, as a shell session: the command that prints the note above it,
  # then `ls -lt` listings of the posts and of the notes tended most recently.
  # Index page only.
  - source: ./plugins/home
    enabled: true
    options:
      section: head
    layout:
      position: beforeBody
      priority: 1
  - source: ./plugins/home
    enabled: true
    options:
      section: listing
      postsFolder: posts
      notesFolder: notes
      recentCount: 8
    layout:
      position: afterBody
      priority: 5
  # A folder's own page lists what is below it: `tree` output for the notes,
  # `ls -lt` output for the posts.
  - source: ./plugins/folder-tree
    enabled: true
    options:
      trees:
        - notes
      lists:
        - posts
    layout:
      position: afterBody
      priority: 1
  # The colophon: an ASCII plant at the end of each note, grown from its length
  # and its links, with the date it was last tended.
  - source: ./plugins/note-plant
    enabled: true
    layout:
      position: afterBody
      priority: 3
  - source: ./plugins/explorer-tweaks
    enabled: false
    layout:
      position: body
      priority: 110
      display: all
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: false
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    # the default frame, so that the 404 page keeps the head and the nav
    "404":
      template: default
      exclude:
        - graph
        - comments
        - backlinks
      positions:
        beforeBody: []
        right: []
    content: {}
    folder:
      exclude:
        - tag-list
        - comments
        - backlinks
        - graph
        - table-of-contents
    tag:
      exclude:
        - tag-list
        - comments
        - backlinks
        - graph
        - table-of-contents
    canvas: {}
    bases: {}
